<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Alex Rivera, Revenue Operations and GTM Engineer. I turn a pile of sales tools into one system that tells each rep what to do next, and why."><title>Alex Rivera, Revenue Operations and GTM Engineer. I turn a pile of sales tools into one system that tells each rep what to do next, and why.</title><style>svg{--bg:#0D1117;--bg2:#111826;--card:#141C2E;--card2:#1E293B;--line:#1E293B;--line2:#334155;--ink:#F1F5F9;--mut:#A3B0C2;--q:#94A3B8;--acc:#6EA8FF;--acct:#93C0FF;--on:#0A0F1A;--gr:#6EE7B7;--okbg:#052E1F}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bg2{fill:var(--bg2)} .card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
.rise{animation:rise .7s ease-out both} .grow{transform-box:fill-box;transform-origin:left;animation:grow 1s ease-out both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .mover{display:none}}
@keyframes t0{0%{opacity:0}0.00%{opacity:0;transform:translateY(6px)}2.50%{opacity:1;transform:none}22.50%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t0{opacity:0;animation:t0 12.8s linear infinite}@keyframes t1{0%{opacity:0}25.00%{opacity:0;transform:translateY(6px)}27.50%{opacity:1;transform:none}47.50%{opacity:1;transform:none}50.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t1{opacity:0;animation:t1 12.8s linear infinite}@keyframes t2{0%{opacity:0}50.00%{opacity:0;transform:translateY(6px)}52.50%{opacity:1;transform:none}72.50%{opacity:1;transform:none}75.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t2{opacity:0;animation:t2 12.8s linear infinite}@keyframes t3{0%{opacity:0}75.00%{opacity:0;transform:translateY(6px)}77.50%{opacity:1;transform:none}97.50%{opacity:1;transform:none}100.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t3{opacity:0;animation:t3 12.8s linear infinite}@media (prefers-reduced-motion:reduce){.t0{opacity:1}}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--line)"/></pattern><radialGradient id="glow"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect width="1000" height="340" rx="18"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1000" height="340" class="bg2"/><rect width="1000" height="340" fill="url(#g)" opacity=".6"/><circle cx="800" cy="150" r="260" fill="url(#glow)"/></g><rect x=".5" y=".5" width="999" height="339" rx="18" fill="none" stroke="var(--line)"/><g class="rise"><circle cx="52" cy="62" r="5" class="dot"/><circle cx="52" cy="62" r="5" class="dot ping"/><text x="66.0" y="67.0" font-size="13" font-weight="500" text-anchor="start" class="mono q" letter-spacing="2.4">ALEX RIVERA</text><text x="44" y="128" font-size="50" font-weight="600" letter-spacing="-1.6">Revenue Operations</text><text x="44" y="184" font-size="50" font-weight="600" letter-spacing="-1.6"><tspan class="acct">and</tspan> GTM Engineer</text><text x="46.0" y="222.0" font-size="16" font-weight="400" text-anchor="start" class="mut" >I turn a pile of sales tools into one system</text><text x="46.0" y="244.0" font-size="16" font-weight="400" text-anchor="start" class="mut" >that tells each rep what to do next, and why.</text></g><rect x="44" y="270" width="420" height="38" rx="10" class="card"/><rect x="58" y="282" width="46" height="14" rx="7" fill="var(--okbg)"/><circle cx="66" cy="289" r="3" class="gr"/><text x="73.0" y="293.0" font-size="9.5" font-weight="600" text-anchor="start" class="mono gr" letter-spacing="1">LIVE</text><text x="114.0" y="294.0" font-size="13.5" font-weight="500" text-anchor="start" class="t0" >Lead to first touch: 2 days to 9 minutes</text><text x="114.0" y="294.0" font-size="13.5" font-weight="500" text-anchor="start" class="t1" >Forecast built from data, not gut feel</text><text x="114.0" y="294.0" font-size="13.5" font-weight="500" text-anchor="start" class="t2" >Every account scored before the stand-up</text><text x="114.0" y="294.0" font-size="13.5" font-weight="500" text-anchor="start" class="t3" >One record per company, across every tool</text><path d="M678 70 C 730 70, 720 168, 744 168" class="wire"/><rect x="560" y="53" width="118" height="34" rx="9" class="card2"/><text x="619.0" y="75.0" font-size="13" font-weight="500" text-anchor="middle" class="" >CRM</text><path d="M678 126 C 730 126, 720 168, 744 168" class="wire"/><rect x="560" y="109" width="118" height="34" rx="9" class="card2"/><text x="619.0" y="131.0" font-size="13" font-weight="500" text-anchor="middle" class="" >Billing</text><path d="M678 182 C 730 182, 720 168, 744 168" class="wire"/><rect x="560" y="165" width="118" height="34" rx="9" class="card2"/><text x="619.0" y="187.0" font-size="13" font-weight="500" text-anchor="middle" class="" >Product</text><path d="M678 238 C 730 238, 720 168, 744 168" class="wire"/><rect x="560" y="221" width="118" height="34" rx="9" class="card2"/><text x="619.0" y="243.0" font-size="13" font-weight="500" text-anchor="middle" class="" >Support</text><path d="M836 168 L 868 168" class="wire"/><circle cx="790" cy="168" r="46" fill="var(--acc)" opacity=".18" class="ping"/><circle cx="790" cy="168" r="46" fill="var(--acc)"/><text x="790.0" y="165.0" font-size="13" font-weight="600" text-anchor="middle" class="on" >Daily</text><text x="790.0" y="182.0" font-size="13" font-weight="600" text-anchor="middle" class="on" >score</text><rect x="868" y="146" width="104" height="44" rx="10" fill="var(--card)" stroke="var(--acc)" stroke-width="1.6"/><text x="920.0" y="167.0" font-size="13" font-weight="600" text-anchor="middle" class="" >Rep brief</text><text x="920.0" y="182.0" font-size="10.5" font-weight="400" text-anchor="middle" class="mono q" >by 8 am</text><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-0.00s" repeatCount="indefinite" path="M678 70 C 730 70, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-0.45s" repeatCount="indefinite" path="M678 126 C 730 126, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-0.90s" repeatCount="indefinite" path="M678 182 C 730 182, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-1.35s" repeatCount="indefinite" path="M678 238 C 730 238, 720 168, 744 168"/></circle><circle r="4.5" fill="var(--gr)" class="mover"><animateMotion dur="1.3s" repeatCount="indefinite" path="M836 168 L 868 168"/></circle></svg>