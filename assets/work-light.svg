<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="316" viewBox="0 0 1000 316" role="img" aria-label="Selected work: Signal scoring, Lead router, Record cleanup, Forecast model, Rep brief, Profile kit."><title>Selected work: Signal scoring, Lead router, Record cleanup, Forecast model, Rep brief, Profile kit.</title><style>svg{--bg:#FFFFFF;--bg2:#F6F8FB;--card:#FFFFFF;--card2:#EEF2F7;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0B1220;--mut:#475569;--q:#5B6779;--acc:#2457E6;--acct:#1D47C4;--on:#FFFFFF;--gr:#047857;--okbg:#ECFDF5}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bg2{fill:var(--bg2)} .card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
.rise{animation:rise .7s ease-out both} .grow{transform-box:fill-box;transform-origin:left;animation:grow 1s ease-out both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .mover{display:none}}
</style><g class="rise" style="animation-delay:0.00s"><rect x="1.0" y="1" width="323.3" height="150" rx="14" class="card"/><text x="21.0" y="27.0" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >01</text><circle cx="300.3" cy="23" r="4" class="gr"/><circle cx="300.3" cy="23" r="4" fill="var(--gr)" class="ping"/><text x="21.0" y="55.0" font-size="17" font-weight="650" text-anchor="start" class="" >Signal scoring</text><text x="21.0" y="79.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Nightly account scores with decay and a</text><text x="21.0" y="97.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >plain-English reason for each one.</text><line x1="21.0" y1="113" x2="304.3" y2="113" stroke="var(--line)"/><text x="21.0" y="136.0" font-size="15" font-weight="650" text-anchor="start" class="" >5 feeds, 1 brief</text></g><g class="rise" style="animation-delay:0.08s"><rect x="338.3" y="1" width="323.3" height="150" rx="14" class="card"/><text x="358.3" y="27.0" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >02</text><circle cx="637.7" cy="23" r="4" class="gr"/><circle cx="637.7" cy="23" r="4" fill="var(--gr)" class="ping"/><text x="358.3" y="55.0" font-size="17" font-weight="650" text-anchor="start" class="" >Lead router</text><text x="358.3" y="79.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Domain and name matching, deal-owner</text><text x="358.3" y="97.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >guards and SLA timers for every inbound lead.</text><line x1="358.3" y1="113" x2="641.7" y2="113" stroke="var(--line)"/><text x="358.3" y="136.0" font-size="15" font-weight="650" text-anchor="start" class="" >2 days to 9 min</text></g><g class="rise" style="animation-delay:0.16s"><rect x="675.7" y="1" width="323.3" height="150" rx="14" class="card"/><text x="695.7" y="27.0" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >03</text><circle cx="975.0" cy="23" r="4" class="gr"/><circle cx="975.0" cy="23" r="4" fill="var(--gr)" class="ping"/><text x="695.7" y="55.0" font-size="17" font-weight="650" text-anchor="start" class="" >Record cleanup</text><text x="695.7" y="79.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Rules-first dedupe across every tool, with a</text><text x="695.7" y="97.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >backup before each merge.</text><line x1="695.7" y1="113" x2="979.0" y2="113" stroke="var(--line)"/><text x="695.7" y="136.0" font-size="15" font-weight="650" text-anchor="start" class="" >18% to 0.4% dupes</text></g><g class="rise" style="animation-delay:0.24s"><rect x="1.0" y="165" width="323.3" height="150" rx="14" class="card"/><text x="21.0" y="191.0" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >04</text><circle cx="300.3" cy="187" r="4" class="gr"/><circle cx="300.3" cy="187" r="4" fill="var(--gr)" class="ping"/><text x="21.0" y="219.0" font-size="17" font-weight="650" text-anchor="start" class="" >Forecast model</text><text x="21.0" y="243.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Stage gates and weighted pipeline rebuilt so</text><text x="21.0" y="261.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >the commit number holds up.</text><line x1="21.0" y1="277" x2="304.3" y2="277" stroke="var(--line)"/><text x="21.0" y="300.0" font-size="15" font-weight="650" text-anchor="start" class="" >92% accurate</text></g><g class="rise" style="animation-delay:0.32s"><rect x="338.3" y="165" width="323.3" height="150" rx="14" class="card"/><text x="358.3" y="191.0" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >05</text><circle cx="637.7" cy="187" r="4" class="gr"/><circle cx="637.7" cy="187" r="4" fill="var(--gr)" class="ping"/><text x="358.3" y="219.0" font-size="17" font-weight="650" text-anchor="start" class="" >Rep brief</text><text x="358.3" y="243.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >A morning email per rep: who to call, the</text><text x="358.3" y="261.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >signal behind it, the last touch.</text><line x1="358.3" y1="277" x2="641.7" y2="277" stroke="var(--line)"/><text x="358.3" y="300.0" font-size="15" font-weight="650" text-anchor="start" class="" >Daily</text></g><g class="rise" style="animation-delay:0.40s"><rect x="675.7" y="165" width="323.3" height="150" rx="14" class="card"/><text x="695.7" y="191.0" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >06</text><circle cx="975.0" cy="187" r="4" class="gr"/><circle cx="975.0" cy="187" r="4" fill="var(--gr)" class="ping"/><text x="695.7" y="219.0" font-size="17" font-weight="650" text-anchor="start" class="" >Profile kit</text><text x="695.7" y="243.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >The generator that drew every card on this</text><text x="695.7" y="261.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >page, light and dark.</text><line x1="695.7" y1="277" x2="979.0" y2="277" stroke="var(--line)"/><text x="695.7" y="300.0" font-size="15" font-weight="650" text-anchor="start" class="" >Open source</text></g></svg>