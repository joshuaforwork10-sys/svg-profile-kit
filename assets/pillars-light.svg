<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-label="What I do: Clean data, Signals, Routing, Forecast, Automation."><title>What I do: Clean data, Signals, Routing, Forecast, Automation.</title><style>svg{--bg:#FFFFFF;--bg2:#F6F8FB;--card:#FFFFFF;--card2:#EEF2F7;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0B1220;--mut:#475569;--q:#5B6779;--acc:#2457E6;--acct:#1D47C4;--on:#FFFFFF;--gr:#047857;--okbg:#ECFDF5}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bg2{fill:var(--bg2)} .card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
.rise{animation:rise .7s ease-out both} .grow{transform-box:fill-box;transform-origin:left;animation:grow 1s ease-out both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .mover{display:none}}
</style><g class="rise" style="animation-delay:0.00s"><rect x="1.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="19.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(39.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="10" ry="4"/><path d="M-10 -8v14c0 2.2 4.5 4 10 4s10-1.8 10-4v-14"/><path d="M-10 -1c0 2.2 4.5 4 10 4s10-1.8 10-4"/></g><text x="19.0" y="90.0" font-size="16" font-weight="650" text-anchor="start" class="" >Clean data</text><text x="19.0" y="116.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >One record per company.</text><text x="19.0" y="135.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Dedupe, enrich and keep</text><text x="19.0" y="154.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >it that way with rules</text><text x="19.0" y="173.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >that run every night.</text></g><g class="rise" style="animation-delay:0.08s"><rect x="203.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="221.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(241.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 4c3-9 8-9 11 0s8 9 11 0"/><circle cx="0" cy="0" r="2.4"/><path d="M-6 -10a12 12 0 0 1 12 0M-3 -6a6 6 0 0 1 6 0"/></g><text x="221.0" y="90.0" font-size="16" font-weight="650" text-anchor="start" class="" >Signals</text><text x="221.0" y="116.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Product usage, email and</text><text x="221.0" y="135.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >web activity scored with</text><text x="221.0" y="154.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >decay, so old noise</text><text x="221.0" y="173.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >drops off.</text></g><g class="rise" style="animation-delay:0.16s"><rect x="405.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="423.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(443.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 -3 11 -11 3 11 0 2z"/><path d="M0 2 11 -11"/></g><text x="423.0" y="90.0" font-size="16" font-weight="650" text-anchor="start" class="" >Routing</text><text x="423.0" y="116.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Inbound leads reach the</text><text x="423.0" y="135.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >right owner in minutes,</text><text x="423.0" y="154.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >with guards for live</text><text x="423.0" y="173.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >deals and opt-outs.</text></g><g class="rise" style="animation-delay:0.24s"><rect x="607.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="625.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(645.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 10h22M-7 10v-8M0 10v-15M7 10v-11"/></g><text x="625.0" y="90.0" font-size="16" font-weight="650" text-anchor="start" class="" >Forecast</text><text x="625.0" y="116.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Stage gates with entry</text><text x="625.0" y="135.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >and exit rules, so the</text><text x="625.0" y="154.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >pipeline number means</text><text x="625.0" y="173.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >something.</text></g><g class="rise" style="animation-delay:0.32s"><rect x="809.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="827.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(847.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -11l2.6 7.4L10 -1l-7.4 2.6L0 9l-2.6-7.4L-10 -1l7.4-2.6z"/></g><text x="827.0" y="90.0" font-size="16" font-weight="650" text-anchor="start" class="" >Automation</text><text x="827.0" y="116.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >Scripts and agents that</text><text x="827.0" y="135.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >do the busywork, each</text><text x="827.0" y="154.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >one tested read-only</text><text x="827.0" y="173.0" font-size="13" font-weight="400" text-anchor="start" class="mut" >first.</text></g></svg>